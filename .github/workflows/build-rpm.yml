name: Build RPM for ROSA Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода программы
        uses: actions/checkout@v4

      - name: Установка сборщика RPM (fpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Создание ярлыка и сборка .rpm для ROSA
        run: |
          chmod +x archive_sanitizer.py
          cat << 'EOF' > archive-sanitizer.desktop
          [Desktop Entry]
          Name=Санитар Архива
          Comment=Проверка целостности медиафайлов и поиск сбойных секторов
          Exec=/usr/bin/archive-sanitizer
          Icon=drive-harddisk
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          fpm -s dir -t rpm \
            -n archive-sanitizer \
            -v 1.0.${{ github.run_number }} \
            -a x86_64 \
            --description "Санитар Архива — проверка целостности медиафайлов и поиск сбойных секторов" \
            -d python3 \
            -d python3-tkinter \
            -d ffmpeg \
            -d jpeginfo \
            -d mp3val \
            -d flac \
            -d imagemagick \
            -d poppler \
            -d p7zip \
            -d file \
            archive_sanitizer.py=/usr/bin/archive-sanitizer \
            archive-sanitizer.desktop=/usr/share/applications/archive-sanitizer.desktop

      - name: Выгрузка готового .rpm для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: archive-sanitizer-rosa-rpm
          path: "*.rpm"
