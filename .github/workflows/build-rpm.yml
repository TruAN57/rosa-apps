name: Build RPM (32 & 64 bit) for ROSA Linux

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода программы
        uses: actions/checkout@v4

      - name: Установка сборщика RPM (fpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Сборка двух .rpm (32-бит i586 и 64-бит x86_64) для ROSA
        run: |
          chmod +x .github/workflows/archive_sanitizer.py
          for ARCH in i586 x86_64; do
            fpm -s dir -t rpm \
              -n archive-sanitizer \
              -v 1.0.${{ github.run_number }} \
              -a $ARCH \
              --description "Санитар Архива — проверка целостности медиафайлов и поиск сбойных секторов" \
              -d python3 \
              -d python3-tkinter \
              -d ffmpeg \
              -d jpeginfo \
              -d mp3val \
              -d flac \
              -d imagemagick \
              -d poppler \
              -d p7zip \
              -d file \
              .github/workflows/archive_sanitizer.py=/usr/bin/archive-sanitizer \
              .github/workflows/archive-sanitizer.desktop=/usr/share/applications/archive-sanitizer.desktop
          done

      - name: Публикация обоих .rpm в раздел Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" *.rpm \
            --title "Санитар Архива v1.0.${{ github.run_number }}" \
            --notes "Готовые RPM-пакеты для ROSA Linux (32-бит i586 и 64-бит x86_64)"
